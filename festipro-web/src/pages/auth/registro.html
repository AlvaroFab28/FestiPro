<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FestiPro</title>
    <link rel="stylesheet" href="/src/assets/css/global.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col bg-fp-bg-light dark:bg-fp-bg-dark text-slate-800 dark:text-slate-200 transition-colors duration-300">
    <header id="app-header" class="sticky top-0 z-50 min-h-[76px] w-full"></header>
    
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="w-full max-w-5xl bg-white dark:bg-fp-surface-dark rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row transition-colors duration-300">
            
            <!-- Panel Izquierdo (Branding / Inspiración con Spotlight Claro/Oscuro y Estrellas) -->
            <div class="md:w-1/2 login-left-bg p-10 flex-col justify-center text-white relative hidden md:flex spotlight-panel spotlight-left">
                <!-- Blobs decorativos animados -->
                <div class="absolute -top-10 -left-10 w-44 h-44 bg-white/10 rounded-full blur-2xl float-blob"></div>
                <div class="absolute -bottom-10 -right-10 w-44 h-44 bg-white/10 rounded-full blur-2xl float-blob" style="animation-delay: -4s;"></div>
                <div class="absolute top-1/2 left-1/4 w-32 h-32 bg-white/5 rounded-full blur-2xl float-blob" style="animation-delay: -2s;"></div>
                
                <!-- Campo de estrellas titilantes (estrellas vectoriales de 5 puntas) -->
                <div class="absolute inset-0 z-0 pointer-events-none opacity-50">
                    <i class="ph-fill ph-star star text-[10px] text-white/70" style="top: 12%; left: 15%; --star-duration: 3s; animation-delay: 0.1s;"></i>
                    <i class="ph-fill ph-star star text-[14px] text-white/90" style="top: 25%; left: 78%; --star-duration: 4s; animation-delay: 1.2s;"></i>
                    <i class="ph-fill ph-star star text-[11px] text-white/60" style="top: 38%; left: 42%; --star-duration: 2.5s; animation-delay: 0.5s;"></i>
                    <i class="ph-fill ph-star star text-[16px] text-white/80" style="top: 55%; left: 12%; --star-duration: 5s; animation-delay: 2.2s;"></i>
                    <i class="ph-fill ph-star star text-[12px] text-white/70" style="top: 68%; left: 82%; --star-duration: 3.5s; animation-delay: 0.8s;"></i>
                    <i class="ph-fill ph-star star text-[15px] text-white/85" style="top: 82%; left: 32%; --star-duration: 4.5s; animation-delay: 1.7s;"></i>
                    <i class="ph-fill ph-star star text-[10px] text-white/60" style="top: 8%; left: 62%; --star-duration: 3.2s; animation-delay: 0.3s;"></i>
                    <i class="ph-fill ph-star star text-[13px] text-white/75" style="top: 48%; left: 88%; --star-duration: 3.8s; animation-delay: 1.4s;"></i>
                    <i class="ph-fill ph-star star text-[11px] text-white/60" style="top: 88%; left: 70%; --star-duration: 3.6s; animation-delay: 0.9s;"></i>
                    <i class="ph-fill ph-star star text-[14px] text-white/80" style="top: 30%; left: 28%; --star-duration: 4.2s; animation-delay: 0.6s;"></i>
                    <i class="ph-fill ph-star star text-[12px] text-white/70" style="top: 62%; left: 52%; --star-duration: 2.8s; animation-delay: 1.9s;"></i>
                    <i class="ph-fill ph-star star text-[10px] text-white/50" style="top: 76%; left: 22%; --star-duration: 3.4s; animation-delay: 0.4s;"></i>
                    <i class="ph-fill ph-star star text-[15px] text-white/85" style="top: 20%; left: 50%; --star-duration: 4.8s; animation-delay: 1.5s;"></i>
                    <i class="ph-fill ph-star star text-[12px] text-white/70" style="top: 92%; left: 10%; --star-duration: 3.1s; animation-delay: 0.7s;"></i>
                    <i class="ph-fill ph-star star text-[13px] text-white/80" style="top: 45%; left: 68%; --star-duration: 3.9s; animation-delay: 1.1s;"></i>
                </div>

                <div class="relative z-10">
                    <a href="/" class="flex items-center space-x-2 mb-12 group">
                        <i class="ph-fill ph-music-notes text-2xl transition-transform duration-300 group-hover:scale-110"></i>
                        <span class="text-3xl font-display font-bold tracking-tight">FestiPro.</span>
                    </a>
                    <h2 class="text-4xl font-display font-bold leading-tight mb-4">Únete a la<br>comunidad</h2>
                    <p class="text-white/80 text-lg mb-10">Publica tus eventos o encuentra a los artistas ideales en minutos.</p>
                    
                    <!-- Cita inspiradora en lugar del review vacío -->
                    <div class="flex flex-col bg-white/10 p-6 rounded-xl backdrop-blur-md border border-white/20 shadow-lg">
                        <i class="ph ph-quotes text-3xl text-white/40 mb-2 leading-none"></i>
                        <p class="text-base font-medium italic leading-relaxed text-white/95">
                            "La música da alma al universo, alas a la mente, vuelo a la imaginación."
                        </p>
                        <span class="text-xs text-white/70 mt-3 block font-semibold tracking-wider uppercase">— Platón</span>
                    </div>
                </div>
            </div>

            <!-- Panel Derecho (Formulario de Registro con Spotlight Claro/Oscuro) -->
            <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center spotlight-panel spotlight-right bg-white dark:bg-fp-surface-dark transition-colors duration-300">
                <div class="max-w-md w-full mx-auto relative z-10">
                    <h1 class="text-3xl font-display font-bold text-slate-900 dark:text-white mb-2">Crea tu cuenta</h1>
                    <p class="text-slate-500 dark:text-slate-400 mb-6">Únete a la plataforma líder de entretenimiento</p>

                    <!-- Formulario de Registro Estilizado -->
                    <form id="register-form" novalidate>
                        
                        <!-- Selección de Rol Interactiva -->
                        <div class="mb-5">
                            <p class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Soy...</p>
                            <div class="grid grid-cols-2 gap-4">
                                <!-- Tarjeta Anfitrión -->
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="role" value="Anfitrión" class="peer sr-only" checked>
                                    <div class="p-3 rounded-xl border-2 border-slate-200 dark:border-fp-border-dark hover:border-fp-primary-light/50 dark:hover:border-fp-primary-dark/50 peer-checked:border-fp-primary-light dark:peer-checked:border-fp-primary-dark peer-checked:bg-fp-primary-light/5 dark:peer-checked:bg-fp-primary-dark/10 transition-all text-center h-full shadow-sm hover:shadow-md flex flex-col items-center">
                                        <i class="ph ph-ticket text-3xl mb-1 text-fp-primary-light dark:text-fp-primary-dark"></i>
                                        <span class="block font-bold text-slate-800 dark:text-white text-sm">Anfitrión</span>
                                        <span class="block text-xs text-slate-500 dark:text-slate-400 mt-1 leading-tight">Busco talento para mis eventos</span>
                                    </div>
                                    <!-- Checkmark SVG para dar feedback de selección -->
                                    <div class="absolute top-2 right-2 w-5 h-5 bg-fp-primary-light text-white rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity shadow-sm">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                    </div>
                                </label>

                                <!-- Tarjeta Talento -->
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="role" value="Talento" class="peer sr-only">
                                    <div class="p-3 rounded-xl border-2 border-slate-200 dark:border-fp-border-dark hover:border-fp-primary-light/50 dark:hover:border-fp-primary-dark/50 peer-checked:border-fp-primary-light dark:peer-checked:border-fp-primary-dark peer-checked:bg-fp-primary-light/5 dark:peer-checked:bg-fp-primary-dark/10 transition-all text-center h-full shadow-sm hover:shadow-md flex flex-col items-center">
                                        <i class="ph ph-microphone text-3xl mb-1 text-fp-primary-light dark:text-fp-primary-dark"></i>
                                        <span class="block font-bold text-slate-800 dark:text-white text-sm">Talento</span>
                                        <span class="block text-xs text-slate-500 dark:text-slate-400 mt-1 leading-tight">Ofrezco mis servicios artísticos</span>
                                    </div>
                                    <div class="absolute top-2 right-2 w-5 h-5 bg-fp-primary-light text-white rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity shadow-sm">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Nombre Completo -->
                        <div class="mb-4">
                            <label for="reg-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre completo</label>
                            <div class="relative">
                                <input type="text" id="reg-name" name="name" autocomplete="name" class="peer w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-fp-border-dark bg-white dark:bg-fp-surface-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-fp-primary-light dark:focus:ring-fp-primary-dark focus:border-transparent outline-none transition-all" placeholder="Juan Pérez" required>
                                <i class="ph ph-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-lg input-icon-anim pointer-events-none"></i>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-4">
                            <label for="reg-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Correo electrónico</label>
                            <div class="relative">
                                <input type="email" id="reg-email" name="email" autocomplete="email" class="peer w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-fp-border-dark bg-white dark:bg-fp-surface-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-fp-primary-light dark:focus:ring-fp-primary-dark focus:border-transparent outline-none transition-all" placeholder="tuemail@ejemplo.com" required>
                                <i class="ph ph-envelope-simple absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-lg input-icon-anim pointer-events-none"></i>
                            </div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-6">
                            <label for="reg-pass" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Contraseña</label>
                            <div class="relative">
                                <input type="password" id="reg-pass" name="password" autocomplete="new-password" class="peer w-full pl-10 pr-10 py-2.5 rounded-lg border border-slate-300 dark:border-fp-border-dark bg-white dark:bg-fp-surface-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-fp-primary-light dark:focus:ring-fp-primary-dark focus:border-transparent outline-none transition-all" placeholder="Mínimo 8 caracteres" required minlength="8">
                                <i class="ph ph-lock-simple absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-lg input-icon-anim pointer-events-none"></i>
                                <button type="button" class="toggle-password-btn absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer" aria-label="Mostrar contraseña">
                                    <i class="ph ph-eye text-lg"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Botón CTA premium vibrante -->
                        <button type="submit" class="shimmer-btn w-full bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white font-bold py-3 rounded-lg transition-all shadow-md hover:shadow-lg hover:shadow-fp-primary-light/20 dark:hover:shadow-fp-primary-dark/20 cursor-pointer flex items-center justify-center space-x-2">
                            <span>Crear cuenta gratis</span>
                            <i class="ph ph-user-plus text-lg"></i>
                        </button>
                    </form>

                    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                        ¿Ya tienes cuenta? <a href="login.html" class="font-medium text-fp-primary-light dark:text-fp-primary-dark hover:underline">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer id="app-footer" class="min-h-[76px] w-full mt-auto"></footer>

    <script type="module" src="/src/assets/js/utils.js"></script>
    <script type="module" src="./js/auth.js"></script>
</body>
</html>
